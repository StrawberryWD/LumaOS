# LumaOS system configuration, read from the CD at boot (ETC/LUMAOS.CFG).
# One "key=value" per line, '#' starts a comment, unknown keys are listed
# by the `config` command instead of being silently ignored.
#
# theme          light | dark
# resolution     WIDTHxHEIGHT: 640x360 800x450 800x600 1024x576 1024x768 1280x720
# desktop_icons  1 | 0
# hostname       free text, max 31 chars
theme=light
resolution=800x450
desktop_icons=1
hostname=lumaos-live
